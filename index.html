<script>
function clock(){
  datenow = Math.floor(Date.now() / 1000);
  timenow = datenow % 86400;
  document.getElementById("clock").innerHTML = datenow.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + "<br>" + timenow.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}
setInterval(clock, 1000);

//this was written by some LLM but I should probably take the time to rewrite this myself at some point
//the code works, but it is surprisingly large for what it does
//and I also feel a little weird not knowing how such a central piece of my site works
(function() {
  const params = new URLSearchParams(window.location.search);
  const page = params.get('page');
  if (!page) return;

  const s = page.trim();

  // Reject scheme-prefixed values (e.g. "http:", "javascript:", "data:")
  if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) return;
  //I guess it is a good idea to not allow creating URLs that cause external sites to be displayed within my site?

  // Set iframe (assumes iframe[name="IM"] exists)
  document.querySelector('iframe[name="IM"]').src = s;

  // Remove only the 'page' parameter from the URL without reloading
  params.delete('page');
  const newSearch = params.toString();
  const newUrl = window.location.pathname + (newSearch ? '?' + newSearch : '') + window.location.hash;
  history.replaceState(null, '', newUrl);
})();
</script>
