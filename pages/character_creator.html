<script>
function toBase62(num) {
  const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  if(num === 0){ return '0'; }
  let result = '';  while (num > 0) {
    result = chars[num % 62] + result;
    num = Math.floor(num / 62);
  }
return result;
}

function reroll_uid(){
  new_uid_raw_integer = Math.floor(Math.random()*Math.pow(2,128));
  new_uid = toBase62(new_uid_raw_integer);
  
  while(new_uid.length < 22){ new_uid = "0" + new_uid; }
  
  document.getElementById("uid").innerHTML = new_uid;
}

function adjust_textinput_size(id,min_length=4){
  content = document.getElementById(id).value;
  needed_length = content.length;
  if(needed_length<min_length){needed_length=min_length;}
  
  document.getElementById(id).size = needed_length.toString();
}
adjust_textinput_size("name_input");

function toggle_editing_view(){
  is_editing = document.getElementById("editing_toggle").checked;
  
  if(is_editing){
    document.getElementById("name_text").innerHTML = "";
    document.getElementById("name_input").style.display = "inline";
    
    document.getElementById("basics_text").innerHTML = "";
    document.getElementById("basics_input").style.display = "inline";
  } else {
    name = document.getElementById("name_input").value;
    document.getElementById("name_text").innerHTML = name;
    document.getElementById("name_input").style.display = "none";
    
    basics = document.getElementById("basics_input").value;
    basics = basics.replaceAll("\n","<br>");
    document.getElementById("basics_text").innerHTML = basics;
    document.getElementById("basics_input").style.display = "none";
  }
}
</script>
